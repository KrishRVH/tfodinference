[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "tfodinference"
version = "0.1.0"
description = "TensorFlow Object Detection inference for video files."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "LicenseRef-Proprietary"
authors = [
  { name = "Jacobo Rosillo" },
  { name = "Krish Ravi" },
]
dependencies = [
  "numpy>=2.5.0",
  "opencv-python>=4.13.0.92",
  "tensorflow>=2.21.0",
  "tensorflow-object-detection-api>=0.1.1",
]

[project.scripts]
tfodinference = "tfodinference.cli:main"

[dependency-groups]
dev = [
  "bandit[toml]>=1.9.4",
  "basedpyright>=1.39.9",
  "coverage[toml]>=7.14.3",
  "hatchling>=1.30.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.20",
]
deep = [
  "deptry>=0.25.1",
  "interrogate>=1.7.0",
  "mypy>=2.1.0",
  "slotscheck>=0.20.0",
  "vulture>=2.16",
  "xenon>=0.9.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tfodinference"]

[tool.ruff]
line-length = 100
required-version = ">=0.15.20"
show-fixes = true
src = ["src", "tests"]
target-version = "py313"
unsafe-fixes = false

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
explicit-preview-rules = true
select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "D203",
  "D213",
  "ISC001",
  "PLC0415",
]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.isort]
known-first-party = ["tfodinference"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
failOnWarnings = true
reportAny = "none"
reportExplicitAny = "none"
reportMissingTypeStubs = "none"
reportUnreachable = "error"
reportUnusedCallResult = "none"

[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
strict = true
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_expr = false
disallow_any_unimported = false
show_column_numbers = true
show_error_code_links = true
show_error_end = true
show_error_codes = true
pretty = true
strict_equality_for_none = true
warn_unreachable = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=tfodinference",
  "--cov-report=term-missing:skip-covered",
]
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tfodinference"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.deptry]
extend_exclude = [".git", ".gstack", ".venv"]
known_first_party = ["tfodinference"]

[tool.bandit]
exclude_dirs = [".git", ".gstack", ".venv", "tests"]
recursive = true
targets = ["src"]

[tool.interrogate]
exclude = [".git", ".gstack", ".venv", "tests"]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-module = false
ignore-nested-functions = false
ignore-private = true
ignore-private-nested = true
ignore-semiprivate = true
verbose = 1

[tool.vulture]
exclude = [".git", ".gstack", ".venv"]
min_confidence = 90
paths = ["src", "tests"]
sort_by_size = true
